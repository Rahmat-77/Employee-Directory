<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Accounts Verification | Employee Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl space-y-5">
    
    <!-- Google Logo Animated -->
    <div class="w-16 h-16 rounded-2xl bg-white flex items-center justify-center mx-auto shadow-lg shadow-white/10 p-3">
      <svg class="w-full h-full" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
    </div>

    <div>
      <h2 class="text-xl font-extrabold text-white">Google Account Verified</h2>
      <p class="text-xs text-slate-400 mt-1">Single Sign-On OAuth token exchanged successfully</p>
    </div>

    <!-- Verified User Badge -->
    <div class="p-4 rounded-2xl bg-slate-950/80 border border-slate-800 text-left flex items-center space-x-3.5">
      <div class="w-10 h-10 rounded-full bg-indigo-600 text-white font-bold text-sm flex items-center justify-center flex-shrink-0">
        {{ user.name[:2].upper() }}
      </div>
      <div class="min-w-0">
        <p class="text-sm font-bold text-white truncate">{{ user.name }}</p>
        <p class="text-xs text-indigo-400 truncate font-mono">{{ user.email }}</p>
      </div>
    </div>

    <!-- Progress indicator -->
    <div class="space-y-2">
      <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
        <div class="bg-indigo-500 h-1.5 rounded-full animate-pulse w-full"></div>
      </div>
      <p class="text-[11px] text-slate-400">Redirecting to Employee Directory dashboard...</p>
    </div>

  </div>

  <script>
    setTimeout(() => {
      window.location.href = '/';
    }, 1500);
  </script>
</body>
</html>
